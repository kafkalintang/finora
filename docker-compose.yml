services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: finora, POSTGRES_PASSWORD: finora_dev, POSTGRES_DB: finora }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes: { pgdata: {} }
